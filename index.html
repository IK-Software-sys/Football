<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Wall Game</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation; /* Prevents zooming on double tap on mobile */
        }
        #network-panel {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        input, button {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }
        #game-panel {
            display: none;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        canvas {
            background: #dcb37b;
            border: 2px solid #555;
            border-radius: 4px;
            max-width: 100%;
            height: auto;
            margin-top: 10px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .controls button {
            flex: 1;
            margin: 0 5px;
            background-color: #ddd;
            border: 1px solid #aaa;
            border-radius: 4px;
            padding: 10px 5px;
        }
        .controls button.active {
            background-color: #888;
            color: white;
            font-weight: bold;
        }
        #status {
            font-weight: bold;
            margin: 10px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div id="network-panel">
        <h3>Multiplayer Connection</h3>
        <p>Your ID: <strong id="my-id">Connecting...</strong></p>
        <p><i>Share this ID with your opponent, or connect to theirs.</i></p>
        <hr>
        <input type="text" id="opponent-id" placeholder="Enter Opponent ID">
        <button id="connect-btn">Connect & Play</button>
        <p id="connection-status"></p>
    </div>

    <div id="game-panel">
        <div id="status">Waiting for connection...</div>
        <div class="controls">
            <button id="btn-move" class="active" onclick="setMode('move')">Move</button>
            <button id="btn-hwall" onclick="setMode('hwall')">H-Wall (3)</button>
            <button id="btn-vwall" onclick="setMode('vwall')">V-Wall (3)</button>
        </div>
        <canvas id="gameCanvas" width="360" height="360"></canvas>
    </div>

    <script>
        // --- Network & P2P Setup ---
        const peer = new Peer();
        let conn = null;
        let myRole = null; // 'red' (Host/P1) or 'blue' (Guest/P2)
        
        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
            startGameAs('red'); // If someone connects to us, we are Red (Host)
        });

        document.getElementById('connect-btn').onclick = () => {
            const oppId = document.getElementById('opponent-id').value;
            if (!oppId) return;
            document.getElementById('connection-status').innerText = "Connecting...";
            conn = peer.connect(oppId);
            conn.on('open', () => {
                setupConnection();
                startGameAs('blue'); // If we connect to someone, we are Blue (Guest)
            });
        };

        function setupConnection() {
            document.getElementById('network-panel').style.display = 'none';
            document.getElementById('game-panel').style.display = 'block';
            
            conn.on('data', (data) => {
                // Receive opponent's action
                if (data.type === 'move') {
                    if (myRole === 'red') { p2.x = data.x; p2.y = data.y; }
                    else { p1.x = data.x; p1.y = data.y; }
                } else if (data.type === 'wall') {
                    walls.push({ x: data.x, y: data.y, type: data.wallType });
                }
                currentTurn = (currentTurn === 'red') ? 'blue' : 'red';
                updateStatus();
                draw();
            });
        }

        // --- Game Logic & State ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 9;
        const cellSize = canvas.width / gridSize;
        
        let p1 = { x: 4, y: 8 }; // Red (needs to reach y = 0)
        let p2 = { x: 4, y: 0 }; // Blue (needs to reach y = 8)
        let walls = []; // Array of {x, y, type: 'h'|'v'}
        
        let currentTurn = 'red';
        let actionMode = 'move'; // 'move', 'hwall', 'vwall'

        function startGameAs(role) {
            myRole = role;
            updateStatus();
            draw();
        }

        function setMode(mode) {
            actionMode = mode;
            document.getElementById('btn-move').className = (mode === 'move') ? 'active' : '';
            document.getElementById('btn-hwall').className = (mode === 'hwall') ? 'active' : '';
            document.getElementById('btn-vwall').className = (mode === 'vwall') ? 'active' : '';
        }

        function updateStatus() {
            const statusDiv = document.getElementById('status');
            if (currentTurn === myRole) {
                statusDiv.innerText = "Your Turn (" + myRole.toUpperCase() + ")";
                statusDiv.style.color = myRole;
            } else {
                statusDiv.innerText = "Opponent's Turn";
                statusDiv.style.color = "black";
            }
        }

        // --- Core Rules & Pathfinding ---
        function hasWallBlock(x1, y1, x2, y2) {
            // Check if there is a wall blocking movement between cell (x1,y1) and (x2,y2)
            if (x1 === x2) { // Vertical move, check horizontal walls
                let minY = Math.min(y1, y2);
                for (let w of walls) {
                    if (w.type === 'h' && w.y === minY && (x1 >= w.x && x1 <= w.x + 2)) return true;
                }
            } else if (y1 === y2) { // Horizontal move, check vertical walls
                let minX = Math.min(x1, x2);
                for (let w of walls) {
                    if (w.type === 'v' && w.x === minX && (y1 >= w.y && y1 <= w.y + 2)) return true;
                }
            }
            return false;
        }

        function canReachGoal(player, targetY) {
            // Breadth-First Search to ensure the path isn't completely blocked
            let queue = [{ x: player.x, y: player.y }];
            let visited = new Set([`${player.x},${player.y}`]);

            while (queue.length > 0) {
                let curr = queue.shift();
                if (curr.y === targetY) return true;

                const moves = [
                    { x: curr.x, y: curr.y - 1 }, { x: curr.x, y: curr.y + 1 },
                    { x: curr.x - 1, y: curr.y }, { x: curr.x + 1, y: curr.y }
                ];

                for (let m of moves) {
                    if (m.x >= 0 && m.x < gridSize && m.y >= 0 && m.y < gridSize) {
                        if (!hasWallBlock(curr.x, curr.y, m.x, m.y)) {
                            if (!visited.has(`${m.x},${m.y}`)) {
                                visited.add(`${m.x},${m.y}`);
                                queue.push(m);
                            }
                        }
                    }
                }
            }
            return false;
        }

        function isValidWall(wx, wy, type) {
            // Out of bounds check (wall is 3 blocks long)
            if (type === 'h' && (wx > 6 || wy >= 8)) return false;
            if (type === 'v' && (wy > 6 || wx >= 8)) return false;

            // Overlap check
            for (let w of walls) {
                if (w.type === type) {
                    if (type === 'h' && w.y === wy && Math.abs(w.x - wx) < 3) return false;
                    if (type === 'v' && w.x === wx && Math.abs(w.y - wy) < 3) return false;
                } else {
                    // Cross intersection check
                    if (type === 'h' && w.type === 'v') {
                        if (wx <= w.x && wx + 2 >= w.x && wy >= w.y && wy <= w.y + 2) return false;
                    }
                    if (type === 'v' && w.type === 'h') {
                        if (wy <= w.y && wy + 2 >= w.y && wx >= w.x && wx <= w.x + 2) return false;
                    }
                }
            }

            // Blocking check: temporarily add wall and run BFS
            walls.push({ x: wx, y: wy, type: type });
            let p1CanWin = canReachGoal(p1, 0);
            let p2CanWin = canReachGoal(p2, 8);
            walls.pop(); // remove temp wall

            return p1CanWin && p2CanWin;
        }

        // --- Interaction ---
        canvas.addEventListener('click', (e) => {
            if (currentTurn !== myRole) return;

            const rect = canvas.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            const cy = e.clientY - rect.top;
            const gridX = Math.floor(cx / cellSize);
            const gridY = Math.floor(cy / cellSize);

            if (actionMode === 'move') {
                const me = (myRole === 'red') ? p1 : p2;
                const opp = (myRole === 'red') ? p2 : p1;
                
                // Check if move is exactly 1 square away (no diagonals)
                if (Math.abs(me.x - gridX) + Math.abs(me.y - gridY) === 1) {
                    // Check collision with opponent and walls
                    if (!(gridX === opp.x && gridY === opp.y) && !hasWallBlock(me.x, me.y, gridX, gridY)) {
                        me.x = gridX;
                        me.y = gridY;
                        
                        conn.send({ type: 'move', x: gridX, y: gridY });
                        endTurn();
                    }
                }
            } else {
                // Wall Placement
                const type = (actionMode === 'hwall') ? 'h' : 'v';
                if (isValidWall(gridX, gridY, type)) {
                    walls.push({ x: gridX, y: gridY, type: type });
                    conn.send({ type: 'wall', x: gridX, y: gridY, wallType: type });
                    endTurn();
                } else {
                    alert("Invalid wall placement! You cannot block the path entirely or overlap walls.");
                }
            }
        });

        function endTurn() {
            // Check win condition
            const me = (myRole === 'red') ? p1 : p2;
            const targetY = (myRole === 'red') ? 0 : 8;
            if (me.y === targetY) {
                alert("You Win!");
            }

            currentTurn = (currentTurn === 'red') ? 'blue' : 'red';
            setMode('move');
            updateStatus();
            draw();
        }

        // --- Rendering ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Grid
            ctx.strokeStyle = '#a47c4b';
            ctx.lineWidth = 1;
            for (let i = 0; i <= gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(canvas.width, i * cellSize);
                ctx.stroke();
            }

            // Draw Walls
            ctx.fillStyle = '#333';
            for (let w of walls) {
                if (w.type === 'h') {
                    ctx.fillRect(w.x * cellSize, (w.y + 1) * cellSize - 4, cellSize * 3, 8);
                } else {
                    ctx.fillRect((w.x + 1) * cellSize - 4, w.y * cellSize, 8, cellSize * 3);
                }
            }

            // Draw Players
            drawPlayer(p1.x, p1.y, 'red');
            drawPlayer(p2.x, p2.y, 'blue');
        }

        function drawPlayer(x, y, color) {
            ctx.beginPath();
            ctx.arc(x * cellSize + cellSize / 2, y * cellSize + cellSize / 2, cellSize / 3, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        draw(); // Initial render
    </script>
</body>
</html>
