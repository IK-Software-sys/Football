<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Gridlock - P2P Fixed</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a12;
            --panel-bg: rgba(25, 25, 35, 0.85);
            --text-color: #e2e8f0;
            --accent-red: #ff3366;
            --accent-blue: #00f0ff;
            --accent-wall: #ffaa00;
            --border-glow: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            touch-action: manipulation;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 51, 102, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 240, 255, 0.15) 0px, transparent 50%);
        }

        #network-panel, #game-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        h3 {
            margin-top: 0;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--accent-red), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #my-id {
            color: var(--accent-blue);
            background: rgba(0, 240, 255, 0.1);
            padding: 6px 10px;
            border-radius: 4px;
            font-family: monospace;
            word-break: break-all;
            display: inline-block;
            margin-top: 5px;
        }

        input {
            background: rgba(25, 25, 35, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        button {
            background: linear-gradient(135deg, #1e1e30, #2d2d44);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            width: 100%;
        }

        button:active {
            transform: scale(0.98);
        }

        #connect-btn {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #game-panel {
            display: none;
        }

        #status {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 8px;
        }

        .controls button {
            flex: 1;
            font-size: 13px;
            padding: 10px 2px;
            text-transform: uppercase;
        }

        .controls button#btn-move.active {
            border-color: #fff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
            background: rgba(255,255,255,0.15);
        }
        .controls button#btn-hwall.active, .controls button#btn-vwall.active {
            border-color: var(--accent-wall);
            box-shadow: 0 0 12px rgba(255, 170, 0, 0.4);
            background: rgba(255, 170, 0, 0.15);
            color: var(--accent-wall);
        }

        .canvas-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        canvas {
            background: #12121c;
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div id="network-panel">
        <h3>Neon Gridlock</h3>
        <p style="text-align:center; margin-bottom:20px;">Your Core ID:<br><strong id="my-id">Initializing...</strong></p>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
        <input type="text" id="opponent-id" placeholder="Enter Enemy Core ID">
        <button id="connect-btn">Establish Link</button>
        <p id="connection-status" style="text-align:center; color: var(--accent-wall); font-size:14px; margin-top: 15px; word-break: break-all;"></p>
    </div>

    <div id="game-panel">
        <div id="status">Syncing System...</div>
        <div class="controls">
            <button id="btn-move" class="active" onclick="setMode('move')">Navigate</button>
            <button id="btn-hwall" onclick="setMode('hwall')">H-Barrier</button>
            <button id="btn-vwall" onclick="setMode('vwall')">V-Barrier</button>
        </div>
        <div class="canvas-container">
            <canvas id="gameCanvas" width="360" height="360"></canvas>
        </div>
    </div>

    <script>
        // --- Hardened Network Config ---
        // Adding explicit Google ICE (STUN) servers to bypass strict NAT routers/cellular firewalls
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' }
                ]
            }
        };

        const peer = new Peer(peerConfig);
        let conn = null;
        let myRole = null; 
        
        const statusText = document.getElementById('connection-status');

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
            statusText.innerText = "Ready for connection.";
        });

        // Error Handling System
        peer.on('error', (err) => {
            console.error("PeerJS Error:", err.type, err);
            if (err.type === 'peer-unavailable') {
                statusText.innerText = "Error: Target ID not found. Check for typos.";
            } else if (err.type === 'network') {
                statusText.innerText = "Error: Lost connection to signaling server.";
            } else if (err.type === 'browser-incompatible') {
                statusText.innerText = "Error: WebRTC is not supported by this browser.";
            } else {
                statusText.innerText = `System Error: ${err.type}`;
            }
        });

        // Handle incoming connection (Host side)
        peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            statusText.innerText = "Handshake detected... Connecting.";
            setupConnection();
            startGameAs('red');
        });

        // Initiate connection (Guest side)
        document.getElementById('connect-btn').onclick = () => {
            const oppId = document.getElementById('opponent-id').value.trim();
            if (!oppId) {
                statusText.innerText = "Please enter an ID first.";
                return;
            }
            statusText.innerText = "Routing through STUN servers...";
            
            conn = peer.connect(oppId, { reliable: true });
            
            conn.on('open', () => {
                setupConnection();
                startGameAs('blue');
            });
        };

        function setupConnection() {
            document.getElementById('network-panel').style.display = 'none';
            document.getElementById('game-panel').style.display = 'block';
            
            conn.on('data', (data) => {
                if (data.type === 'move') {
                    if (myRole === 'red') { p2.x = data.x; p2.y = data.y; }
                    else { p1.x = data.x; p1.y = data.y; }
                } else if (data.type === 'wall') {
                    walls.push({ x: data.x, y: data.y, type: data.wallType });
                }
                currentTurn = (currentTurn === 'red') ? 'blue' : 'red';
                updateStatus();
                draw();
            });

            conn.on('close', () => {
                alert("Opponent disconnected.");
                location.reload();
            });
        }

        // --- Game Logic & State ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 9;
        const cellSize = canvas.width / gridSize;
        
        let p1 = { x: 4, y: 8 }; // Neon Red
        let p2 = { x: 4, y: 0 }; // Neon Blue
        let walls = []; 
        
        let currentTurn = 'red';
        let actionMode = 'move'; 

        function startGameAs(role) {
            myRole = role;
            updateStatus();
            draw();
        }

        function setMode(mode) {
            actionMode = mode;
            document.getElementById('btn-move').className = (mode === 'move') ? 'active' : '';
            document.getElementById('btn-hwall').className = (mode === 'hwall') ? 'active' : '';
            document.getElementById('btn-vwall').className = (mode === 'vwall') ? 'active' : '';
        }

        function updateStatus() {
            const statusDiv = document.getElementById('status');
            if (currentTurn === myRole) {
                statusDiv.innerText = "YOUR TURN";
                statusDiv.style.color = myRole === 'red' ? 'var(--accent-red)' : 'var(--accent-blue)';
                statusDiv.style.textShadow = `0 0 15px ${statusDiv.style.color}`;
            } else {
                statusDiv.innerText = "ENEMY TURN";
                statusDiv.style.color = "rgba(255,255,255,0.4)";
                statusDiv.style.textShadow = "none";
            }
        }

        // --- Core Rules & Pathfinding ---
        function hasWallBlock(x1, y1, x2, y2) {
            if (x1 === x2) { 
                let minY = Math.min(y1, y2);
                for (let w of walls) {
                    if (w.type === 'h' && w.y === minY && (x1 >= w.x && x1 <= w.x + 2)) return true;
                }
            } else if (y1 === y2) { 
                let minX = Math.min(x1, x2);
                for (let w of walls) {
                    if (w.type === 'v' && w.x === minX && (y1 >= w.y && y1 <= w.y + 2)) return true;
                }
            }
            return false;
        }

        function canReachGoal(player, targetY) {
            let queue = [{ x: player.x, y: player.y }];
            let visited = new Set([`${player.x},${player.y}`]);

            while (queue.length > 0) {
                let curr = queue.shift();
                if (curr.y === targetY) return true;

                const moves = [
                    { x: curr.x, y: curr.y - 1 }, { x: curr.x, y: curr.y + 1 },
                    { x: curr.x - 1, y: curr.y }, { x: curr.x + 1, y: curr.y }
                ];

                for (let m of moves) {
                    if (m.x >= 0 && m.x < gridSize && m.y >= 0 && m.y < gridSize) {
                        if (!hasWallBlock(curr.x, curr.y, m.x, m.y)) {
                            if (!visited.has(`${m.x},${m.y}`)) {
                                visited.add(`${m.x},${m.y}`);
                                queue.push(m);
                            }
                        }
                    }
                }
            }
            return false;
        }

        function isValidWall(wx, wy, type) {
            if (type === 'h' && (wx > 6 || wy >= 8)) return false;
            if (type === 'v' && (wy > 6 || wx >= 8)) return false;

            for (let w of walls) {
                if (w.type === type) {
                    if (type === 'h' && w.y === wy && Math.abs(w.x - wx) < 3) return false;
                    if (type === 'v' && w.x === wx && Math.abs(w.y - wy) < 3) return false;
                } else {
                    if (type === 'h' && w.type === 'v') {
                        if (wx <= w.x && wx + 2 >= w.x && wy >= w.y && wy <= w.y + 2) return false;
                    }
                    if (type === 'v' && w.type === 'h') {
                        if (wy <= w.y && wy + 2 >= w.y && wx >= w.x && wx <= w.x + 2) return false;
                    }
                }
            }

            walls.push({ x: wx, y: wy, type: type });
            let p1CanWin = canReachGoal(p1, 0);
            let p2CanWin = canReachGoal(p2, 8);
            walls.pop(); 

            return p1CanWin && p2CanWin;
        }

        // --- Interaction ---
        canvas.addEventListener('click', (e) => {
            if (currentTurn !== myRole) return;

            const rect = canvas.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            const cy = e.clientY - rect.top;
            
            const gridX = Math.floor((cx / rect.width) * gridSize);
            const gridY = Math.floor((cy / rect.height) * gridSize);

            if (actionMode === 'move') {
                const me = (myRole === 'red') ? p1 : p2;
                const opp = (myRole === 'red') ? p2 : p1;
                
                if (Math.abs(me.x - gridX) + Math.abs(me.y - gridY) === 1) {
                    if (!(gridX === opp.x && gridY === opp.y) && !hasWallBlock(me.x, me.y, gridX, gridY)) {
                        me.x = gridX;
                        me.y = gridY;
                        
                        conn.send({ type: 'move', x: gridX, y: gridY });
                        endTurn();
                    }
                }
            } else {
                const type = (actionMode === 'hwall') ? 'h' : 'v';
                if (isValidWall(gridX, gridY, type)) {
                    walls.push({ x: gridX, y: gridY, type: type });
                    conn.send({ type: 'wall', x: gridX, y: gridY, wallType: type });
                    endTurn();
                }
            }
        });

        function endTurn() {
            const me = (myRole === 'red') ? p1 : p2;
            const targetY = (myRole === 'red') ? 0 : 8;
            if (me.y === targetY) {
                alert("VICTORY ACHIEVED!");
            }

            currentTurn = (currentTurn === 'red') ? 'blue' : 'red';
            setMode('move');
            updateStatus();
            draw();
        }

        // --- Engine Rendering ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 1;
            ctx.shadowBlur = 0; 
            for (let i = 0; i <= gridSize; i++) {
                ctx.beginPath(); ctx.moveTo(i * cellSize, 0); ctx.lineTo(i * cellSize, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * cellSize); ctx.lineTo(canvas.width, i * cellSize); ctx.stroke();
            }

            ctx.fillStyle = 'rgba(255, 51, 102, 0.05)';
            ctx.fillRect(0, 0, canvas.width, cellSize);
            ctx.fillStyle = 'rgba(0, 240, 255, 0.05)';
            ctx.fillRect(0, canvas.height - cellSize, canvas.width, cellSize);

            for (let w of walls) {
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffaa00';
                ctx.fillStyle = '#ffcc66';
                
                if (w.type === 'h') {
                    ctx.fillRect(w.x * cellSize + 2, (w.y + 1) * cellSize - 3, cellSize * 3 - 4, 6);
                } else {
                    ctx.fillRect((w.x + 1) * cellSize - 3, w.y * cellSize + 2, 6, cellSize * 3 - 4);
                }
            }

            drawPlayer(p1.x, p1.y, '#ff3366');
            drawPlayer(p2.x, p2.y, '#00f0ff');
        }

        function drawPlayer(x, y, solidColor) {
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = solidColor;
            
            ctx.beginPath();
            ctx.arc(x * cellSize + cellSize / 2, y * cellSize + cellSize / 2, cellSize / 3, 0, 2 * Math.PI);
            ctx.fillStyle = solidColor;
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(x * cellSize + cellSize / 2, y * cellSize + cellSize / 2, cellSize / 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            
            ctx.restore();
        }

        draw(); 
    </script>
</body>
</html>
